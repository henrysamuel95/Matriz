<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vista previa - Cabecera de Contrataciones FUV</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #253246;
      background: #f5f7fa;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    button { font: inherit; cursor: pointer; }

    .contract-bar {
      width: 100%;
      background: #fff;
      border-top: 3px solid #123e79;
      border-bottom: 1px solid #dce3ea;
      box-shadow: 0 3px 12px rgb(28 45 68 / 5%);
    }

    .metrics {
      display: grid;
      grid-template-columns: 1.15fr repeat(5, minmax(0, 1fr));
      gap: 0;
      margin: 0;
      padding: 10px 20px 9px;
    }

    .metric {
      min-width: 0;
      margin: 0;
      padding: 2px 18px;
      border-left: 1px solid #e2e7ed;
    }

    .metric:first-child {
      padding-left: 12px;
      border-left: 3px solid #0a68a3;
    }

    .metric dt {
      min-height: 29px;
      margin: 0 0 4px;
      color: #667384;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
    }

    .metric dd {
      margin: 0;
      color: #26374d;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
    }

    .metric--primary dd { color: #104a83; font-size: 20px; }
    .metric--empty dd { color: #b34c44; }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      align-items: center;
      gap: 8px 16px;
      min-height: 56px;
      padding: 6px 20px;
      border-top: 1px solid #e9edf2;
      background: #fbfcfe;
    }

    .status {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      min-width: 0;
    }

    .status__label {
      color: #647185;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status__badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 28px;
      padding: 5px 12px;
      border: 0;
      border-radius: 999px;
      background: #f5841f;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0 8px 18px rgb(15 23 42 / 16%);
    }

    .status__dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      flex: 0 0 auto;
    }

    .status__step {
      padding-left: 9px;
      border-left: 1px solid rgb(255 255 255 / 45%);
      font-variant-numeric: tabular-nums;
    }

    .actions { display: flex; align-items: center; justify-content: flex-end; justify-self: end; gap: 8px; }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 14px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .action--primary {
      border: 1px solid #123e79;
      background: #123e79;
      color: #fff;
    }

    .action--primary:hover { background: #0b2e5f; }
    .action--primary:focus-visible, .support summary:focus-visible, .support button:focus-visible {
      outline: 2px solid #0b71ad;
      outline-offset: 2px;
    }

    .support { position: relative; }

    .support summary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-width: 100px;
      min-height: 34px;
      padding: 0 13px;
      border: 1px solid #ccd6e1;
      border-radius: 4px;
      color: #344b65;
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      list-style: none;
      cursor: pointer;
    }

    .support summary::-webkit-details-marker { display: none; }
    .support summary:hover { background: #f2f6fa; }

    .support summary::after {
      content: "";
      width: 6px;
      height: 6px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg) translateY(-2px);
    }

    .support[open] summary::after { transform: rotate(225deg) translateY(-1px); }

    .support__menu {
      position: absolute;
      z-index: 2;
      top: calc(100% + 6px);
      right: 0;
      width: 210px;
      padding: 5px;
      border: 1px solid #d4dde7;
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 12px 25px rgb(29 45 68 / 14%);
    }

    .support__menu button {
      display: block;
      width: 100%;
      padding: 9px 10px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: #35485d;
      font-size: 12px;
      text-align: left;
    }

    .support__menu button:hover { background: #eef4fa; }
    .support__menu button + button { margin-top: 2px; }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 5;
      max-width: min(320px, calc(100vw - 40px));
      padding: 11px 14px;
      border-radius: 4px;
      background: #253b55;
      color: #fff;
      box-shadow: 0 8px 20px rgb(20 35 55 / 16%);
      font-size: 12px;
    }

    .toast[hidden] { display: none; }

    @media (max-width: 1300px) {
      .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 10px; }
      .metric:nth-child(4) { border-left: 3px solid #e2e7ed; padding-left: 12px; }
    }

    @media (max-width: 850px) {
      .toolbar { grid-template-columns: minmax(0, 1fr); }
    }

    @media (max-width: 700px) {
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 10px; row-gap: 8px; }
      .metric { padding: 2px 10px; }
      .metric:nth-child(odd) { border-left: 3px solid #e2e7ed; padding-left: 9px; }
      .metric:first-child { border-left-color: #0a68a3; }
      .metric dt { min-height: 29px; font-size: 11px; }
      .metric dd, .metric--primary dd { font-size: 15px; }
      .toolbar { padding: 7px 16px; }
    }

    @media (max-width: 360px) {
      .metrics { grid-template-columns: 1fr; }
      .metric, .metric:nth-child(odd), .metric:nth-child(4) { border-left: 3px solid #e2e7ed; }
      .metric:first-child { border-left-color: #0a68a3; }
      .metric dt { min-height: 0; }
      .toolbar { gap: 10px; }
    }
  </style>
</head>
<body>
  <section class="contract-bar" aria-label="Resumen de contratación">
    <dl class="metrics">
      <div class="metric metric--primary">
        <dt>Saldo disponible · Producción</dt>
        <dd>4.500.000.000,00</dd>
      </div>
      <div class="metric metric--empty">
        <dt>Saldo disponible · Póliza</dt>
        <dd>0,00</dd>
      </div>
      <div class="metric metric--empty">
        <dt>Saldo disponible · Costos FUV</dt>
        <dd>0,00</dd>
      </div>
      <div class="metric metric--empty">
        <dt>Saldo disponible · Contratos VCO</dt>
        <dd>0,00</dd>
      </div>
      <div class="metric">
        <dt>Valor general contratado</dt>
        <dd>500.000.000,00</dd>
      </div>
      <div class="metric">
        <dt>Gastado en producción<br>(Contratado + Bienes + Servicios)</dt>
        <dd>500.000.000,00</dd>
      </div>
    </dl>

    <div class="toolbar">
      <div class="status">
        <span class="status__label">Estado actual</span>
        <span class="status__badge"><span class="status__dot" aria-hidden="true"></span>Coordinador<span class="status__step">1/11</span></span>
      </div>
      <div class="actions">
        <button class="action action--primary" type="button" data-demo-action="Ver póliza">Ver póliza</button>
        <details class="support">
          <summary>Soporte</summary>
          <div class="support__menu">
            <button type="button" data-demo-action="Crear carpeta">Crear carpeta</button>
            <button type="button" data-demo-action="Marcar contratado">Marcar contratado</button>
            <button type="button" data-demo-action="Pedir pólizas">Pedir pólizas</button>
            <button type="button" data-demo-action="Asignar documentos">Asignar documentos</button>
            <button type="button" data-demo-action="Recalcular fondos">Recalcular fondos</button>
            <button type="button" data-demo-action="Normalizar flujo">Normalizar flujo</button>
          </div>
        </details>
      </div>
    </div>
  </section>

  <div class="toast" role="status" hidden></div>
  <script>
    const toast = document.querySelector('.toast');
    let toastTimer;
    document.addEventListener('click', (event) => {
      const action = event.target.closest('[data-demo-action]');
      if (!action) return;
      toast.textContent = `${action.dataset.demoAction}: vista previa, sin cambios en Odoo.`;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; }, 3000);
      action.closest('details')?.removeAttribute('open');
    });
  </script>
</body>
</html>
